spring.application.name=assistant-service
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen3:4b}
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.accounts.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.transactions.url=http://localhost:8082
management.endpoints.web.exposure.include=health,info
